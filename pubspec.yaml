name: portrait_morph
description: >
  A pointer-driven portrait morph effect using a custom dart:ui fragment
  shader — edge ripple, fbm-noise wipe, and spring-eased transitions between
  two images. Ported from a WebGL/OGL component. Works on mobile, web, and
  desktop.
version: 1.0.0
homepage: https://github.com/SamarthGarge/portrait_morph

environment:
  sdk: ^3.10.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/portrait_morph.frag