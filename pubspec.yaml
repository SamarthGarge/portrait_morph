name: portrait_morph
description: >-
  A pointer-driven image morph effect using a custom dart:ui fragment shader.
  Features fbm-noise wipe, edge ripple, and spring-eased transitions between
  two images. Supports hover (desktop/web) and press+drag (mobile).
version: 1.0.0
homepage: https://github.com/SamarthGarge/portrait_morph
repository: https://github.com/SamarthGarge/portrait_morph
issue_tracker: https://github.com/SamarthGarge/portrait_morph/issues

topics:
  - ui
  - animation
  - shader
  - widget
  - effects

environment:
  sdk: ^3.10.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/portrait_morph.frag